apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: linkding-store
  namespace: linkding
spec:
  retentionPolicy: "30d"
  configuration:
    destinationPath: s3://linkding-backups/
    endpointURL: http://garage.garage.svc.cluster.local:3900
    s3Credentials:
      accessKeyId:
        name: linkding-backup-secrets
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: linkding-backup-secrets
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip