apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: linkding-daily
  namespace: linkding
spec:
  schedule: "0 0 3 * * *"        # six fields, seconds first: daily 03:00
  backupOwnerReference: self
  immediate: true                # take the first backup right away
  cluster:
    name: linkding-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io