apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: miniflux-db
  namespace: miniflux
spec:
  instances: 1
  storage:
    size: 2Gi
  bootstrap:
    initdb:
      database: miniflux
      owner: miniflux
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: miniflux-store